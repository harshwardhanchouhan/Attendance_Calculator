<!DOCTYPE html>
<html>
    <head>
        <title>Attendance Calculator</title>
        <link rel="stylesheet" href="style.css"> 
    </head>

    <body>
        <div class="maindiv">
            <h1>Attendance Calculator</h1>

            <div class="inputdiv">
                <label for="totalclassHTML">Total Classes:</label>
                <input type="number" id="totalclassHTML" placeholder="Enter the total number of classes">
                <label for="attendedclassHTML">Total Classes Attended:</label>
                <input type="number" id="attendedclassHTML" placeholder="Enter the total number of Classes YOU attended">
                <label for="targetattHTML">Target Attendance:</label>
                <input type="number" id="targetattHTML" value="75">
                <label for="semesterHTML">Semester:</label>
                <input type="text" id="semesterHTML" placeholder="Enter your Semester">
                <button id="calcBtnHTML">Calculate</button> 
            </div>

            <div id="resultHTML">
                <h4>Result Section</h4>
                <div id="actualresultHTML"></div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
